name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 默认禁止被 fork PR 触发 secret 暴露，但这里没有 secret，正常
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单 job 串行跑 lint + typecheck + build，共享同一份 pnpm cache
  # 比起三 job 并行（每个独立 install），节省 ~80s（runner 启动 + 重复 install）
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install (cache hit 后 ~5s)
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Typecheck (tsc -b --force)
        run: pnpm run typecheck

      - name: Test (vitest run)
        run: pnpm run test

      - name: Endpoint contract check（本地双仓有效；CI 单仓检出时自动跳过）
        run: pnpm run contract

      - name: Build (tsc -b + vite)
        run: pnpm run build