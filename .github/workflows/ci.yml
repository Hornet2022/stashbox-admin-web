name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install

      - name: Lint (oxlint)
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install

      - name: Typecheck (tsc)
        run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install

      - name: Build (tsc + vite)
        run: pnpm run build
